<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Moksha '27 — NSUT Annual Cultural Fest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<!-- QR code generator used for the entry pass -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- React (production builds), loaded as plain globals — app.js is plain JS, precompiled ahead of time -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

<style>
  :root{
    --bg:#08080c;
    --bg-raise:#0e0e15;
    --surface:rgba(255,255,255,.045);
    --surface-hi:rgba(255,255,255,.08);
    --border:rgba(255,255,255,.09);
    --border-hi:rgba(255,255,255,.16);
    --text:#f2f1f6;
    --text-dim:#9a9aa8;
    --text-dimmer:#65656f;
    --violet:#8b6bff;
    --violet-soft:#7c5cff;
    --cyan:#33dde6;
    --cyan-soft:#2dd4e0;
    --danger:#ff6b6b;
    --radius:18px;
    --radius-sm:10px;
    --maxw:1120px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -5%, rgba(139,107,255,.16), transparent 60%),
      radial-gradient(ellipse 800px 500px at 85% 8%, rgba(51,221,230,.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  h1,h2,h3,h4{
    font-family:'Space Grotesk', sans-serif;
    margin:0;
    font-weight:600;
    letter-spacing:-.01em;
  }
  p{margin:0;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--violet-soft); color:#fff;}
  :focus-visible{outline:2px solid var(--cyan); outline-offset:3px; border-radius:4px;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }

  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 28px;}

  /* ---------- Nav ---------- */
  header{
    position:sticky; top:0; z-index:40;
    backdrop-filter:blur(14px);
    background:rgba(8,8,12,.55);
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px; max-width:var(--maxw); margin:0 auto;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-family:'Space Grotesk', sans-serif;
    font-size:19px; font-weight:700; letter-spacing:-.01em;
  }
  .brand-mark{
    width:26px; height:26px; border-radius:8px;
    background:linear-gradient(135deg, var(--violet), var(--cyan));
    box-shadow:0 0 16px rgba(139,107,255,.5);
    flex-shrink:0;
  }
  .nav-links{display:flex; gap:32px; font-size:14.5px; color:var(--text-dim);}
  .nav-links a{text-decoration:none; transition:color .2s;}
  .nav-links a:hover{color:var(--text);}
  .nav-cta{
    padding:9px 18px; border-radius:999px; font-size:14px; font-weight:600;
    background:var(--text); color:#0a0a0e; border:none; cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .nav-cta:hover{transform:translateY(-1px); box-shadow:0 6px 20px rgba(139,107,255,.35);}
  .nav-menu-btn{display:none; background:none; border:none; color:var(--text); font-size:24px; cursor:pointer;}

  @media (max-width:760px){
    .nav-links{display:none;}
    .nav-menu-btn{display:block;}
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative; overflow:hidden;
    padding:96px 0 64px;
    text-align:center;
  }
  .glow-orb{
    position:absolute; border-radius:50%; filter:blur(90px); pointer-events:none;
  }
  .glow-orb.a{width:420px; height:420px; background:rgba(139,107,255,.35); top:-160px; left:8%;}
  .glow-orb.b{width:380px; height:380px; background:rgba(51,221,230,.28); top:-100px; right:6%;}

  .hero-eyebrow{
    display:inline-block; font-size:13.5px; color:var(--text-dim);
    padding:6px 14px; border:1px solid var(--border-hi); border-radius:999px;
    margin-bottom:28px; position:relative; z-index:2;
  }
  .hero h1{
    position:relative; z-index:2;
    font-size:clamp(48px, 9vw, 92px);
    line-height:1;
    background:linear-gradient(180deg, #fff 30%, #c9c4e8 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero h1 em{
    font-style:normal;
    background:linear-gradient(120deg, var(--violet) 10%, var(--cyan) 90%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero-sub{
    position:relative; z-index:2;
    max-width:520px; margin:22px auto 0;
    font-size:16.5px; color:var(--text-dim);
  }

  .countdown{
    position:relative; z-index:2;
    display:flex; justify-content:center; gap:14px;
    margin:52px auto 0; flex-wrap:wrap;
  }
  .cd-block{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:18px 6px 14px;
    width:96px;
    backdrop-filter:blur(10px);
    box-shadow:0 0 0 1px rgba(139,107,255,.04), 0 20px 40px -20px rgba(0,0,0,.6);
  }
  .cd-num{
    font-family:'JetBrains Mono', monospace;
    font-size:38px; font-weight:700;
    background:linear-gradient(160deg, #fff, #b9b4e0);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    font-variant-numeric:tabular-nums;
    text-shadow:0 0 30px rgba(139,107,255,.25);
  }
  .cd-label{
    font-size:11.5px; color:var(--text-dimmer); margin-top:6px;
  }
  @media (max-width:520px){
    .cd-block{width:70px; padding:12px 4px 10px;}
    .cd-num{font-size:26px;}
  }

  .hero-actions{
    position:relative; z-index:2;
    display:flex; gap:14px; justify-content:center; margin-top:44px; flex-wrap:wrap;
  }
  .btn-primary{
    padding:13px 28px; border-radius:999px; border:none; cursor:pointer;
    font-size:15px; font-weight:600; color:#0a0a0e;
    background:linear-gradient(120deg, var(--violet), var(--cyan));
    box-shadow:0 0 24px rgba(139,107,255,.35);
    transition:transform .15s ease;
  }
  .btn-primary:hover{transform:translateY(-2px);}
  .btn-ghost{
    padding:13px 26px; border-radius:999px; cursor:pointer;
    font-size:15px; font-weight:600; color:var(--text);
    background:transparent; border:1px solid var(--border-hi);
    transition:background .15s ease, border-color .15s ease;
  }
  .btn-ghost:hover{background:var(--surface); border-color:var(--cyan);}

  /* ---------- Section shell ---------- */
  section.block{padding:88px 0;}
  .section-head{max-width:560px; margin-bottom:44px;}
  .section-head h2{font-size:clamp(28px, 4vw, 38px);}
  .section-head p{color:var(--text-dim); margin-top:12px; font-size:15.5px;}

  /* ---------- About ---------- */
  .about-grid{
    display:grid; grid-template-columns:1.1fr .9fr; gap:48px; align-items:start;
  }
  .about-copy p{color:var(--text-dim); font-size:16px; margin-bottom:16px;}
  .about-stats{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .stat-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:20px;
  }
  .stat-num{font-family:'Space Grotesk',sans-serif; font-size:30px; font-weight:700; color:var(--cyan);}
  .stat-lbl{font-size:13px; color:var(--text-dim); margin-top:4px;}
  @media (max-width:820px){ .about-grid{grid-template-columns:1fr;} }

  /* ---------- Schedule ---------- */
  .tabs{display:flex; gap:10px; margin-bottom:28px; flex-wrap:wrap;}
  .tab-btn{
    padding:10px 20px; border-radius:999px; border:1px solid var(--border);
    background:transparent; color:var(--text-dim); font-size:14.5px; font-weight:500;
    cursor:pointer; transition:all .18s ease;
  }
  .tab-btn.active{
    background:var(--surface-hi); color:var(--text); border-color:var(--violet-soft);
    box-shadow:0 0 20px rgba(139,107,255,.18);
  }
  .day-date{font-size:14px; color:var(--text-dimmer); margin-bottom:20px;}

  .event-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
    margin-bottom:12px; overflow:hidden; transition:border-color .2s ease;
  }
  .event-card:hover{border-color:var(--border-hi);}
  .event-head{
    display:flex; align-items:center; gap:18px; padding:18px 20px; cursor:pointer;
  }
  .event-time{
    font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--cyan);
    width:78px; flex-shrink:0;
  }
  .event-title{font-size:16px; font-weight:600; flex:1;}
  .event-venue{font-size:13.5px; color:var(--text-dim); flex-shrink:0;}
  .event-chevron{
    width:18px; height:18px; flex-shrink:0; color:var(--text-dim);
    transition:transform .25s ease;
  }
  .event-card.open .event-chevron{transform:rotate(180deg);}
  .event-body{
    max-height:0; overflow:hidden; transition:max-height .3s ease;
  }
  .event-card.open .event-body{max-height:120px;}
  .event-body-inner{padding:0 20px 20px 116px; font-size:14.5px; color:var(--text-dim);}
  @media (max-width:640px){
    .event-head{flex-wrap:wrap;}
    .event-venue{width:100%; order:3;}
    .event-body-inner{padding:0 20px 20px 20px;}
  }

  /* ---------- Register CTA band ---------- */
  .register-band{
    background:var(--surface); border:1px solid var(--border); border-radius:24px;
    padding:56px 40px; text-align:center; position:relative; overflow:hidden;
  }
  .register-band::before{
    content:''; position:absolute; inset:0;
    background:radial-gradient(ellipse 500px 260px at 50% 0%, rgba(139,107,255,.18), transparent 70%);
    pointer-events:none;
  }
  .register-band h2{font-size:clamp(26px,4vw,34px); position:relative;}
  .register-band p{color:var(--text-dim); margin:14px auto 30px; max-width:440px; position:relative;}

  /* ---------- Footer ---------- */
  footer{border-top:1px solid var(--border); padding:44px 0 36px;}
  .foot-row{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px;
  }
  .foot-links{display:flex; gap:24px; font-size:14px; color:var(--text-dim);}
  .foot-links a{text-decoration:none; transition:color .2s;}
  .foot-links a:hover{color:var(--cyan);}
  .foot-note{font-size:13px; color:var(--text-dimmer); margin-top:24px;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(5,5,8,.72); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:var(--bg-raise); border:1px solid var(--border-hi); border-radius:20px;
    width:100%; max-width:440px; padding:32px; position:relative;
    box-shadow:0 30px 80px -20px rgba(0,0,0,.7), 0 0 40px rgba(139,107,255,.08);
  }
  .modal-close{
    position:absolute; top:18px; right:18px; background:none; border:none; color:var(--text-dim);
    font-size:20px; cursor:pointer; width:32px; height:32px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; transition:background .15s;
  }
  .modal-close:hover{background:var(--surface); color:var(--text);}
  .modal h3{font-size:22px; margin-bottom:6px;}
  .modal-sub{font-size:14px; color:var(--text-dim); margin-bottom:26px;}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; color:var(--text-dim); margin-bottom:7px;}
  .field input, .field select{
    width:100%; padding:11px 14px; border-radius:10px;
    background:rgba(255,255,255,.03); border:1px solid var(--border);
    color:var(--text); font-size:14.5px; font-family:inherit;
    transition:border-color .15s ease;
  }
  .field input:focus, .field select:focus{border-color:var(--cyan); outline:none;}
  .field-error{font-size:12.5px; color:var(--danger); margin-top:6px; display:none;}
  .field.invalid input, .field.invalid select{border-color:var(--danger);}
  .field.invalid .field-error{display:block;}

  .modal-submit{
    width:100%; padding:13px; border-radius:10px; border:none; cursor:pointer;
    font-size:15px; font-weight:600; color:#0a0a0e; margin-top:6px;
    background:linear-gradient(120deg, var(--violet), var(--cyan));
  }

  /* ---------- Badge (post-submit) ---------- */
  .badge-view{display:none; text-align:center;}
  .badge-view.show{display:block;}
  .badge-card{
    background:linear-gradient(160deg, #14121f, #0a0a12);
    border:1px solid rgba(139,107,255,.35); border-radius:16px;
    padding:26px; margin-bottom:20px;
    box-shadow:0 0 40px rgba(139,107,255,.15);
  }
  .badge-fest{font-size:12.5px; letter-spacing:.03em; color:var(--cyan); margin-bottom:14px;}
  .badge-name{font-family:'Space Grotesk',sans-serif; font-size:21px; font-weight:700; margin-bottom:2px;}
  .badge-roll{font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--text-dim); margin-bottom:18px;}
  .badge-qr{background:#fff; padding:10px; border-radius:10px; display:inline-block; margin-bottom:16px;}
  .badge-event{font-size:13.5px; color:var(--text-dim);}
  .badge-event strong{color:var(--text); font-weight:600;}
  .badge-actions{display:flex; gap:10px;}
  .badge-actions button{flex:1;}
</style>
</head>
<body>

<div id="root"></div>

<script src="app.js"></script>

</body>
</html>
